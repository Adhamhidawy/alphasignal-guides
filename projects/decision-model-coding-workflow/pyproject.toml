[project]
name = "next-check"
version = "0.1.0"
description = "Ask a decision model which ONE extra check should run after Claude Code's required checks pass."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
